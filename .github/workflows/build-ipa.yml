name: Build Pi Control IPA
on:
  push:
    branches: [picontrol-ipa]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use newest Xcode (Liquid Glass needs Xcode 26+)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Selecting $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PiControl.xcodeproj -scheme PiControl -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log \
          || { grep -E "error:" build.log | sort -u | head -40 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PiControl.app Payload/
          zip -qry PiControl.ipa Payload
          ls -la PiControl.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PiControl-ipa
          path: PiControl.ipa
      - name: Publish download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete picontrol-latest -y --cleanup-tag || true
          gh release create picontrol-latest PiControl.ipa --target "$GITHUB_SHA" \
            --title "Pi Control (unsigned IPA)" \
            --notes "Unsigned build. Install with Sideloadly or AltStore using your Apple ID." --prerelease

  screenshots:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          rts=sorted([k for k in d if 'iOS' in k], key=lambda k:[int(x) for x in k.split('iOS-')[1].split('-')])
          devs=[x for x in d[rts[-1]] if x['name'].startswith('iPhone')]
          pick=[x for x in devs if 'Pro' in x['name'] and 'Max' not in x['name']] or devs
          print(pick[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl list devices | grep "$UDID"
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project PiControl.xcodeproj -scheme PiControl -configuration Release \
            -destination "id=$UDID" -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Take screenshots
        run: |
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" simbuild/Build/Products/Release-iphonesimulator/PiControl.app
          mkdir -p shots
          shot() {
            for attempt in 1 2; do
              xcrun simctl terminate "$UDID" com.picontrol.app 2>/dev/null || true
              sleep 2
              xcrun simctl launch "$UDID" com.picontrol.app -demo "${@:2}" || true
              sleep 9
              if xcrun simctl spawn "$UDID" launchctl list | grep -q "com.picontrol.app"; then
                xcrun simctl io "$UDID" screenshot "shots/$1.png"; return 0
              fi
              echo "::warning::$1: app not running after launch (attempt $attempt)"
            done
            xcrun simctl io "$UDID" screenshot "shots/$1-FAILED.png"
          }
          shot 01-overview
          shot 02-utilization -section util
          shot 03-storage -section storage
          shot 04-traffic -section traffic
          shot 05-power -section power
          shot 06-activity -section activity
          shot 07-services -tab 1
          shot 08-sites -tab 2
          shot 09-settings -tab 3
          ls -la shots
      - name: Collect crash logs
        if: always()
        run: |
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -iname "*PiControl*" -exec cp {} shots/crashes/ \; 2>/dev/null || true
          ls shots/crashes | head
          for f in shots/crashes/*; do [ -f "$f" ] && { echo "::error::Crash report $f"; head -c 3000 "$f" | grep -E "Exception|Crashed|Thread 0|PiControl" | head -30; }; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
      - name: Attach screenshots to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload picontrol-latest shots/*.png --clobber
