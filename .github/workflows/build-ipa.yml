name: Build Pi Control IPA
on:
  push:
    branches: [picontrol-ipa]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use newest Xcode (Liquid Glass needs Xcode 26+)
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Selecting $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PiControl.xcodeproj -scheme PiControl -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log \
          || { grep -E "error:" build.log | sort -u | head -40 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PiControl.app Payload/
          zip -qry PiControl.ipa Payload
          ls -la PiControl.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PiControl-ipa
          path: PiControl.ipa
      - name: Publish download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete picontrol-latest -y --cleanup-tag || true
          gh release create picontrol-latest PiControl.ipa --target "$GITHUB_SHA" \
            --title "Pi Control (unsigned IPA)" \
            --notes "Unsigned build. Install with Sideloadly or AltStore using your Apple ID." --prerelease
